---
layout: default
title: 首页
description: 记录人工智能、开源模型与软件工程，也翻译值得被中文读者看见的技术文章。
image: /assets/images/og.png
---
<section class="home-index">
  <div class="container">
    <header class="home-index-header">
      <h1>文章</h1>
      <span>{{ site.posts | size }} 篇</span>
    </header>

    <div class="filter-bar">
      <div class="filter-pills" role="group" aria-label="文章类型筛选">
        <button class="filter-pill active" type="button" data-filter="all">全部</button>
        <button class="filter-pill" type="button" data-filter="原创">原创</button>
        <button class="filter-pill" type="button" data-filter="译文">译文</button>
      </div>
      <label class="search-field">
        <span aria-hidden="true">⌕</span>
        <span class="sr-only">搜索文章</span>
        <input id="post-search" type="search" placeholder="搜索标题、标签……" autocomplete="off">
      </label>
    </div>

    <div class="post-list" id="posts-grid">
      {% for post in site.posts %}{% include post-card.html post=post %}{% endfor %}
    </div>
    <p class="empty-state" id="empty-state" hidden>没有找到匹配的文章，换个关键词试试。</p>
  </div>
</section>
