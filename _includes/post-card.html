<article class="post-row searchable-post" data-title="{{ post.title | escape }}" data-categories="{{ post.categories | join: ' ' | escape }}" data-tags="{{ post.tags | join: ' ' | escape }}">
  <a class="post-row-link" href="{{ post.url | relative_url }}">
    <div class="post-row-meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time>
      {% if post.translation %}
        <span class="post-kind is-translation">译文</span>
      {% else %}
        <span class="post-kind">原创</span>
      {% endif %}
    </div>
    <div class="post-row-content">
      <h2>{{ post.title }}</h2>
      <p>{{ post.description | default: post.excerpt | strip_html | truncate: 150 }}</p>
      <div class="tag-list" aria-label="文章标签">
        {% for tag in post.tags limit: 3 %}<span>#{{ tag }}</span>{% endfor %}
      </div>
    </div>
    <span class="post-row-arrow" aria-hidden="true">→</span>
  </a>
</article>
